<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="CSS/registro-style.css">


    <title>Registro Usuario | SIA</title>
</head>
<body>
     <header>
        <a href="index.html">
            <center>
            <img src="imagenes/logosia.png" alt="Logo de la empresa" width="150">
            </center>
        </a>
    </header>

        <section>
            <center>
            <h3>!Bienvenidos a SIA!</h3>
            <p>
                Registrate y disfruta de 
                productos frescos para tu hogar.
            </p>
            <form action="#" method="post">
                <label for="Nombre">Nombre</label><br>
                <input type="text" id="Nombre">
                <br>
                <label for="correo">Correo de Acceso</label><br>
                <input type="mail" id="correo">
                <br>
                <label for="Telefono">Telefono</label><br>
                <input type="tel" id="Telefono">
                <br>

                <label for="password">Contraseña</label><br>
                <div class="campo-password">
                    <input type="password" id="password">
                    <button type="button" class="btn-ojo" id="btnVerPassword" aria-label="Mostrar u ocultar contraseña">
                        <i class="bi bi-eye" id="iconoVerPassword"></i>
                    </button>
                </div>

                <div class="barra-fortaleza">
                    <div id="barraFortaleza" role="progressbar"></div>
                </div>
                <p id="textoFortaleza"></p>

                <label for="confirmarPassword">Confirma Contraseña</label><br>
                <div class="campo-password">
                    <input type="password" id="confirmarPassword">
                    <button type="button" class="btn-ojo" id="btnVerConfirmar" aria-label="Mostrar u ocultar confirmación">
                        <i class="bi bi-eye" id="iconoVerConfirmar"></i>
                    </button>
                </div>
                <p id="textoCoincide"></p>
                <br>

                <div class="terms-container">
                        <label class="terms-checkbox">
                            <input type="checkbox" id="terminos">
                        </label>
                    <p class="terms-text">Estoy de acuerdo con terminos y condiciones</p>
                </div>

                <button type="submit">Crear Cuenta</button>
                </center>
            </form>
        </section>

        <section>
            <center>
            <p>Continuar con:</p>

            <button type="submit">Google</button>
            <button type="submit">Apple</button>
            </center>
        </section>
    <script src="JAVA/password.js"></script>
    <script src="JAVA/login.js"></script>
</body>
</html>
